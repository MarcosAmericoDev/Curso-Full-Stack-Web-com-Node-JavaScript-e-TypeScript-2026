<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio - Sobreposicao</title>
    <style>
        .caixa {
            background-color: purple;
            width: 700px;
        }

        .tempo-limitado {
            background-color: orange;
            width: 150px;
            padding: 0.5em 1em;
            text-align: center;
            border-radius: 20px;
            color: white;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            position: relative;
            bottom: 75px;
            left: 50px;
        }

        .promocao {
            border: 2px dotted purple;
            width: 500px;
            margin: auto;
            text-align: center;
            padding: 1em 0.5em;
            color: purple;
            border-bottom-right-radius: 20px;
            border-bottom-left-radius: 20px;
            position: relative;
            background-color: white;
            bottom: 60px;
            z-index: 1;
        }

    </style>
</head>
<body>
    
    <h1>Exercício</h1>
    <div class="caixa">
        <img src="img/banner.png"  width="700" alt="">
    </div>

    <div class="tempo-limitado">
        Tempo limitado
    </div>

    <div class="promocao">
        Quero a promoção
    </div>

</body>
</html>
