<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobreposição de elementos</title>
    <style>
        .caixa1 {
            width: 100px;
            height: 100px;
            border: 1px solid blue;
            background-color: lightblue;
            position: relative;
            top: 10px;
            left: 10px;
            z-index: 2;
        }

        .caixa2 {
            width: 100px;
            height: 100px;
            border: 1px solid red;
            background-color: lightcoral;
            position: relative;
            z-index: caixa 1;
        }

        .caixa3 {
            width: 100px;
            height: 100px;
            border: 1px solid green;
            background-color: lightgreen;
            position: relative;
            bottom: 120px;
            left: 80px;
            z-index: 3;
        }

        /*em caso de empate, será levado em
        consideração a ordem que os elementos
        html aparecem, nesse caso, caso as
        três caixa não tivessem z-index, seria
        usado a ordem de caixa 1 no nivel mais
        baixo, caixa 2 no médio e caixa 3 no
        topo*/
    </style>
</head>
<body>
    
    <div class="caixa1">
        caixa 1
    </div>

    <div class="caixa2">
        caixa 2
    </div>

    <div class="caixa3">
        caixa 3
    </div>

</body>
</html>
