<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classe e pseudo-elemento</title>

    <style>
        /* Pseudo-classe
        a:hover {
            background-color: purple;
            color: white;
        }
        */

        a, a:link {
            text-decoration: none;
            color: green;
            padding: 0.5em 1em;
        }
        /* Links visitados */

        a:visited {
            color: red;
        }

        a:hover {
            background-color: green;
            color: white;
        }

        /* links ativos */

        a:active {
            color: red;
        }

        input:checked {
            margin-left: 20px;
        }

        input:focus {
            background-color: purple;
            color: white;
        }

        input:required {
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div>
        Conteúdo da DIV
    </div>

    <h2>Conteúdo do h2</h2>

    <a href="https://www.google.com/">Google</a> |
    <a href="https://www.dsadagadhsrh.com/">Facebook</a> |
    <a href="https://www.srhsrhhrhrs.com/">Instagram</a>

    <h2>Formulário</h2>
    <input type="checkbox"> aceito <br>
    <input type="radio" name="opcao"> Sim <br>
    <input type="radio" name="opcao"> Não <br>
    <input type="text" required placeholder="Digite seu nome">
    <input type="text" placeholder="Digite seu nome">
</body>
</html>
