<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classe e pseudo-elemento</title>

    <style>
        a {
            color: violet;
            padding: 0.5em 1em;
            text-decoration: none;
        }

        a:hover {
            color: white;
            background: violet;
        }
    </style>
</head>
<body>
    <a href="">Home</a>|
    <a href="">Sobre</a>|
    <a href="">Empresa</a>|
    <a href="">Produtos</a>|
    <a href="">Contato</a>|
</body>
</html>
